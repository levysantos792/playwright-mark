name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - uses: actions/checkout@v4

      # Configura o Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Instala dependências da raiz
      - name: Install Root Dependencies
        run: npm install

      # Instala dependências da API
      - name: Install API Dependencies
        run: |
          cd apps/api
          npm install

      # Inicializa banco SQLite
      - name: Init Database
        run: |
          cd apps/api
          npm run db:init

      # Instala dependências da Web
      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm install

      # Cria arquivo .env
      - name: Create .env
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > .env
          echo "BASE_API=${{ secrets.BASE_API }}" >> .env

      # Sobe API
      - name: Start API
        run: |
          cd apps/api
          npm start > api.log 2>&1 &

      # Sobe Web
      - name: Start Web
        run: |
          cd apps/web
          npm start > web.log 2>&1 &

      # Verifica se os secrets chegaram
      - name: Check Environment Variables
        run: |
          echo "BASE_URL definida? $([ -n "$BASE_URL" ] && echo SIM || echo NAO)"
          echo "BASE_API definida? $([ -n "$BASE_API" ] && echo SIM || echo NAO)"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_API: ${{ secrets.BASE_API }}

      # Testa acesso à URL usada pelo Playwright
      - name: Check BASE_URL
        run: |
          echo "Testando acesso à aplicação..."
          curl -I -L "$BASE_URL"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      # Aguarda a aplicação responder
      - name: Wait for Application
        run: |
          npx wait-on "$BASE_URL"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      # Instala navegadores do Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Executa testes
      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_API: ${{ secrets.BASE_API }}
        run: npx playwright test

      # Em caso de falha, exibe logs da aplicação
      - name: Show Logs
        if: failure()
        run: |
          echo "===== API LOG ====="
          cat apps/api/api.log || true

          echo "===== WEB LOG ====="
          cat apps/web/web.log || true

      # Publica relatório do Playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30