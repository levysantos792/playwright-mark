name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60

    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - uses: actions/checkout@v4

      # Configura o Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Instala dependências da raiz
      - name: Install Root Dependencies
        run: npm install

      # Instala dependências da API
      - name: Install API Dependencies
        run: |
          cd apps/api
          npm install

      # Instala dependências da Web
      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm install

      # Cria o .env para os testes
      - name: Create .env
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > .env
          echo "BASE_API=${{ secrets.BASE_API }}" >> .env

      # Verifica se a URL está acessível pelo GitHub Actions
      - name: Check BASE_URL
        run: |
          curl -I -L "$BASE_URL"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      # Instala navegadores do Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Executa os testes
      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASE_API: ${{ secrets.BASE_API }}
        run: npx playwright test

      # Publica o relatório
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30