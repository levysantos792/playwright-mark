# Nome do workflow que aparecerá na aba Actions do GitHub
name: Playwright Tests

# Define quando o workflow será executado
# Neste caso, quando houver push ou pull request
# para as branches main ou master
on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

# Jobs (tarefas) que serão executadas
jobs:
  test:
    # Tempo máximo de execução do job
    timeout-minutes: 60

    # Máquina virtual onde os testes serão executados
    runs-on: ubuntu-latest

    steps:
      # Faz o checkout do código fonte do repositório
      - uses: actions/checkout@v4

      # Configura a versão do Node.js utilizada na execução
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Instala as dependências do projeto
      - name: Install Dependencies
        run: npm install

      # Instala os navegadores e dependências do Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Executa os testes automatizados
      - name: Run Playwright Tests
        run: npx playwright test

      # Publica o relatório HTML como artefato
      # Mesmo que os testes falhem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30